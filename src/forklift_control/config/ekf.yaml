# State order: x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az.
# MPU6050 provides gyro/acceleration, NOT an absolute compass heading.
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    reset_on_time_jump: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    transform_timeout: 0.05
    odom0: /wheel/odometry
    # Fuse twist only: wheel pose is integrated from the same encoder data.
    # vy is measured for mecanum; do not impose a nonholonomic vy=0 constraint.
    odom0_config: [false, false, false, false, false, false,
                   true,  true, false, false, false, true,
                  false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    imu0: /imu/data_raw
    imu0_config: [false, false, false, false, false, false,
                 false, false, false, false, false, true,
                 false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
