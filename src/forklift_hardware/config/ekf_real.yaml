# EKF xe thật (chạy trên Pi cùng esp32_bridge): odom bánh + gyro z MPU6050/6500.
# State order: x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az.
# Khác SIM (forklift_control/config/ekf.yaml): KHÔNG fuse vyaw của bánh. Bánh
# mecanum trượt khi quay chậm: 29/10/2026 odom báo quay 19° trong khi LiDAR chỉ
# thấy ~4° -> góc quay lấy hoàn toàn từ gyro. vx/vy vẫn từ bánh (cũng có trượt,
# AMCL phải chịu phần đó). Covariance đo được chưa hiệu chuẩn.
ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    # IMU 50 Hz, odom 20 Hz qua serial; quá 0,3 s không có tin thì bỏ nguồn đó.
    sensor_timeout: 0.3
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    reset_on_time_jump: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    transform_timeout: 0.05
    odom0: /wheel/odometry
    odom0_config: [false, false, false, false, false, false,
                   true,  true, false, false, false, false,
                  false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    imu0: /imu/data_raw
    imu0_config: [false, false, false, false, false, false,
                 false, false, false, false, false, true,
                 false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
