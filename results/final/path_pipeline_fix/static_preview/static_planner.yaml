global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[-0.1751, -0.225145], [0.52, -0.225145], [0.52, 0.225145], [-0.1751,
        0.225145]]'
      footprint_padding: 0.01
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          obstacle_max_range: 9.5
          obstacle_min_range: 0.12
          raytrace_max_range: 10.0
          raytrace_min_range: 0.12
          topic: /scan
      plugins:
      - static_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.04
      robot_base_frame: base_link
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      transform_tolerance: 0.5
      update_frequency: 2.0
      use_sim_time: false
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /home/thanh/ros_ws/forklift/src/forklift_navigation/maps/warehouse.yaml
